; webserver-ota – WLAN, Weboberfläche, mDNS und Over-the-Air-Updates.
; Gemeinsame Board-Einstellungen kommen aus ../../boards/boards.ini
;
; Erster Upload per USB:   pio run -e esp32dev -t upload
; Danach per WLAN (OTA):   pio run -e esp32dev_ota -t upload

[platformio]
extra_configs = ../../boards/boards.ini
default_envs  = esp32dev

[project]
lib_deps =
; OTA-Ziel: Hostname aus secrets.h (+ ".local") oder IP-Adresse
ota_host = esp-projekt.local
ota_auth = ota-geheim

[env:esp32dev]
extends  = esp32_base
lib_deps = ${project.lib_deps}

[env:esp32dev_ota]
extends         = env:esp32dev
upload_protocol = espota
upload_port     = ${project.ota_host}
upload_flags    = --auth=${project.ota_auth}

[env:esp32s3]
extends  = esp32s3_base
lib_deps = ${project.lib_deps}

[env:esp32c3]
extends  = esp32c3_base
lib_deps = ${project.lib_deps}

[env:nodemcuv2]
extends  = esp8266_base
lib_deps = ${project.lib_deps}

[env:nodemcuv2_ota]
extends         = env:nodemcuv2
upload_protocol = espota
upload_port     = ${project.ota_host}
upload_flags    = --auth=${project.ota_auth}

[env:d1mini]
extends  = d1mini_base
lib_deps = ${project.lib_deps}
