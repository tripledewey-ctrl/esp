; oled-demo – Funktionstest für Boards mit OLED (Heltec WiFi Kit 8, ESP32-C3 0,42")
; und für ein externes SSD1306-Display (128x64, I2C) am DOIT DevKit V1 bzw. NodeMCU.
; Gemeinsame Board-Einstellungen kommen aus ../../boards/boards.ini
;
;   pio run -e esp32c3_oled -t upload -t monitor

[platformio]
extra_configs = ../../boards/boards.ini
default_envs  = esp32c3_oled

[project]
lib_deps =
    olikraus/U8g2@^2.35.30

[env:esp32c3_oled]
extends  = esp32c3_oled_base
lib_deps = ${project.lib_deps}

[env:heltec_wifi_kit_8]
extends  = heltec_wifi_kit_8_base
lib_deps = ${project.lib_deps}

; Externes 0,96"-OLED (SSD1306 128x64) an SDA 21 / SCL 22
[env:doit_devkit_v1]
extends     = doit_devkit_v1_base
lib_deps    = ${project.lib_deps}
build_flags = ${doit_devkit_v1_base.build_flags}
              -D OLED_SDA_PIN=21 -D OLED_SCL_PIN=22 -D OLED_WIDTH=128 -D OLED_HEIGHT=64

; Externes 0,96"-OLED (SSD1306 128x64) an D2 (SDA, GPIO4) / D1 (SCL, GPIO5)
[env:nodemcuv2]
extends     = esp8266_base
lib_deps    = ${project.lib_deps}
build_flags = ${esp8266_base.build_flags}
              -D OLED_SDA_PIN=4 -D OLED_SCL_PIN=5 -D OLED_WIDTH=128 -D OLED_HEIGHT=64
