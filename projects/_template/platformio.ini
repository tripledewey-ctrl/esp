; Projektvorlage – wird von scripts/new-project.sh kopiert.
; Gemeinsame Board-Einstellungen kommen aus ../../boards/boards.ini
;
;   pio run                  -> alle Umgebungen bauen
;   pio run -e esp32dev -t upload -t monitor

[platformio]
extra_configs = ../../boards/boards.ini
default_envs  = esp32dev

[project]
lib_deps =

[env:esp32dev]
extends  = esp32_base
lib_deps = ${project.lib_deps}

[env:esp32s3]
extends  = esp32s3_base
lib_deps = ${project.lib_deps}

[env:esp32c3]
extends  = esp32c3_base
lib_deps = ${project.lib_deps}

[env:nodemcuv2]
extends  = esp8266_base
lib_deps = ${project.lib_deps}

[env:d1mini]
extends  = d1mini_base
lib_deps = ${project.lib_deps}
