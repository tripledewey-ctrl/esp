; wlan-sonde – Messgerät des WLAN-Analyse-Moduls (docs/06-wlan-analyse.md)
;
; Ein Gerät, drei Rollen (im Portal oder in der Weboberfläche wählbar):
;   sonde    – fest montiert, misst alle N Sekunden und meldet an die Zentrale
;   mobil    – Begehung: Messpunkte per Knopfdruck/Webseite erfassen
;   zentrale – sammelt alle Sonden, Übersicht im Browser und auf der LED-Matrix
;
;   pio run -e esp32dev -t upload -t monitor
;   pio run -e waveshare_s3_matrix -t upload -t monitor

[platformio]
extra_configs = ../../boards/boards.ini
default_envs  = esp32dev

[project]
lib_deps =
    tzapu/WiFiManager@^2.0.17
    bblanchon/ArduinoJson@^7.2.0
lib_deps_matrix =
    ${project.lib_deps}
    fastled/FastLED@3.7.8

; ESP32 DevKit ohne Anzeige – typische feste Sonde
[env:esp32dev]
extends     = esp32_base
lib_deps    = ${project.lib_deps}

; ESP32 DevKit mit externer WS2812B-Matrix 8x8 an GPIO13
[env:esp32dev_matrix]
extends     = esp32_base
lib_deps    = ${project.lib_deps_matrix}
build_flags = ${esp32_base.build_flags}
    -D LED_PIN=13
    -D SERPENTINE=true

; ESP32-C3 (z. B. Super Mini) – kleine, günstige Sonde; BOOT-Taste an GPIO9
[env:esp32c3]
extends     = esp32c3_base
lib_deps    = ${project.lib_deps}
build_flags = ${esp32c3_base.build_flags}
    -D BUTTON_PIN=9

; ESP32-S3-DevKitC-1 ohne Anzeige
[env:esp32s3]
extends     = esp32s3_base
lib_deps    = ${project.lib_deps}

; Waveshare ESP32-S3-Matrix – voreingestellt als Zentrale mit Gebäude-Übersicht
[env:waveshare_s3_matrix]
extends     = waveshare_s3_matrix_base
lib_deps    = ${project.lib_deps_matrix}
board_build.partitions = huge_app.csv
build_flags = ${waveshare_s3_matrix_base.build_flags}
    -D LED_COLOR_ORDER=RGB
    -D SERPENTINE=false
    -D BRIGHTNESS=20
    -D MAX_MILLIAMPS=500
    -D DEFAULT_ROLLE='"zentrale"'
