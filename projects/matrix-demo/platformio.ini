; matrix-demo – Test- und Demoprogramm für die Waveshare ESP32-S3-Matrix (8x8 WS2812).
; Gemeinsame Board-Einstellungen kommen aus ../../boards/boards.ini
;
;   pio run -e waveshare_s3_matrix -t upload -t monitor

[platformio]
extra_configs = ../../boards/boards.ini
default_envs  = waveshare_s3_matrix

[project]
lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.3

[env:waveshare_s3_matrix]
extends  = waveshare_s3_matrix_base
lib_deps = ${project.lib_deps}

; Externe 8x8-Matrix an einem normalen ESP32 (Datenleitung GPIO16)
[env:esp32dev]
extends     = esp32_base
lib_deps    = ${project.lib_deps}
build_flags = ${esp32_base.build_flags} -D MATRIX_PIN=16 -D MATRIX_WIDTH=8 -D MATRIX_HEIGHT=8
