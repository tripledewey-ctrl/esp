; sensor-mqtt – BME280 (Temperatur/Luftfeuchte/Luftdruck) per MQTT senden,
; inkl. Home-Assistant-Autodiscovery.
; Gemeinsame Board-Einstellungen kommen aus ../../boards/boards.ini

[platformio]
extra_configs = ../../boards/boards.ini
default_envs  = esp32dev

[project]
lib_deps =
    knolleary/PubSubClient@^2.8
    adafruit/Adafruit BME280 Library@^2.2.4
    bblanchon/ArduinoJson@^7.2.0

[env:esp32dev]
extends  = esp32_base
lib_deps = ${project.lib_deps}

[env:esp32s3]
extends  = esp32s3_base
lib_deps = ${project.lib_deps}

[env:esp32c3]
extends  = esp32c3_base
lib_deps = ${project.lib_deps}

[env:nodemcuv2]
extends  = esp8266_base
lib_deps = ${project.lib_deps}

[env:d1mini]
extends  = d1mini_base
lib_deps = ${project.lib_deps}
