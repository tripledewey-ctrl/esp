; wlan-matrix – WLAN-Signalstärke und Mesh-Knoten auf einer RGB-LED-Matrix,
; mit Konfigurations-Hotspot (WiFiManager) und Weboberfläche.
; Gemeinsame Board-Einstellungen kommen aus ../../boards/boards.ini
;
;   pio run -e esp32dev -t upload -t monitor              ESP32 + externe 8x8-Matrix an GPIO13
;   pio run -e waveshare_s3_matrix -t upload -t monitor   Waveshare ESP32-S3-Matrix (eingebaut)

[platformio]
extra_configs = ../../boards/boards.ini
default_envs  = esp32dev

[project]
lib_deps =
    fastled/FastLED@3.7.8
    tzapu/WiFiManager@^2.0.17
    bblanchon/ArduinoJson@^7.2.0

; ESP32 DevKit + externe WS2812B-Matrix 8x8 (Zickzack) an GPIO13
[env:esp32dev]
extends     = esp32_base
lib_deps    = ${project.lib_deps}
build_flags = ${esp32_base.build_flags}
    -D LED_PIN=13
    -D SERPENTINE=true

; ESP32-S3-DevKitC-1 + externe Matrix an GPIO13
[env:esp32s3]
extends     = esp32s3_base
lib_deps    = ${project.lib_deps}
build_flags = ${esp32s3_base.build_flags}
    -D LED_PIN=13
    -D SERPENTINE=true

; Waveshare ESP32-S3-Matrix: Matrix fest an GPIO14, Strom über USB -> wenig Helligkeit
[env:waveshare_s3_matrix]
extends     = waveshare_s3_matrix_base
lib_deps    = ${project.lib_deps}
board_build.partitions = huge_app.csv      ; kein OTA nötig, mehr Platz für die App
build_flags = ${waveshare_s3_matrix_base.build_flags}
    -D LED_COLOR_ORDER=RGB                 ; bei falschen Farben GRB testen
    -D SERPENTINE=false
    -D BRIGHTNESS=20
    -D MAX_MILLIAMPS=500
