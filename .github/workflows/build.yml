name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  docs:
    name: Doku-Prüfung
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/check-docs.py
      - run: python3 scripts/build-wiki.py "$RUNNER_TEMP/wiki"

  wlan-analyse:
    name: WLAN-Analyse (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    defaults:
      run:
        working-directory: tools/wlan-analyse
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - name: Beispieldaten sind aktuell
        run: |
          python beispiel/erzeugen.py
          git diff --exit-code -- beispiel/
      - run: python -m wlan_analyse demo -o beispiel-bericht.html
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.12'
        with:
          name: wlan-analyse-beispielbericht
          path: tools/wlan-analyse/beispiel-bericht.html

  projects:
    name: Projekt ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [blink, webserver-ota, sensor-mqtt, matrix-demo, wlan-matrix, wlan-sonde, _template]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-${{ runner.os }}-${{ hashFiles('boards/boards.ini') }}
      - run: pip install platformio
      - run: ./scripts/build-all.sh ${{ matrix.project }}

  wled:
    name: WLED ${{ matrix.env }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [wled_esp32, wled_nodemcuv2, wled_d1mini, wled_s3_matrix]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-wled-${{ runner.os }}-${{ hashFiles('scripts/wled-build.sh') }}
      - run: pip install platformio
      - run: ./scripts/wled-build.sh ${{ matrix.env }}
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.env }}
          path: wled/build/bin/*.bin
