; =============================================================================
; Eigene WLED-Builds
;
; Diese Datei wird von scripts/wled-build.sh in den WLED-Quellcode kopiert
; (als platformio_override.ini). Getestet mit WLED v0.15.5.
;
; Alle verfügbaren Optionen: platformio_override.sample.ini im WLED-Quellcode
; =============================================================================

[platformio]
default_envs = wled_esp32, wled_nodemcuv2, wled_d1mini

; Gemeinsame Voreinstellungen für alle eigenen Builds.
; Der LED-Daten-Pin (DATA_PINS) wird pro Board in den Envs unten gesetzt.
[wled_custom]
build_flags =
    -D SERVERNAME='"WLED-Custom"'
    -D PIXEL_COUNTS=60              ; Anzahl LEDs
    -D DEFAULT_LED_COLOR_ORDER=COL_ORDER_GRB
    -D ABL_MILLIAMPS_DEFAULT=2000   ; Strombegrenzung in mA (Netzteil beachten!)
    -D BTNPIN=0                     ; Taster (BOOT-Taste)
    -D WLED_NTP_ENABLED=true
    -D WLED_TIMEZONE=2              ; 2 = MEZ/MESZ (Mitteleuropa)
    ; Standard-WLAN (optional, sonst Einrichtung über Access Point "WLED-AP"):
    ; -D CLIENT_SSID='"MeinWLAN"'
    ; -D CLIENT_PASS='"geheim"'

; ----------------------------------------------------------------------------
; ESP32 DevKit – LED-Daten an GPIO16, inkl. Audioreactive
; ----------------------------------------------------------------------------
[env:wled_esp32]
extends     = env:esp32dev
build_flags = ${common.build_flags} ${esp32.build_flags}
    -D WLED_RELEASE_NAME=\"ESP32_custom\"
    -D DATA_PINS=16                 ; GPIO für die LED-Datenleitung
    ${esp32.AR_build_flags}
    ${wled_custom.build_flags}

; ----------------------------------------------------------------------------
; ESP8266 NodeMCU – LED-Daten an GPIO2 (D4)
; Hinweis: GPIO3 (RX) nutzt DMA und ist auf dem ESP8266 am zuverlässigsten.
; ----------------------------------------------------------------------------
[env:wled_nodemcuv2]
extends     = env:nodemcuv2
build_flags = ${common.build_flags} ${esp8266.build_flags}
    -D WLED_RELEASE_NAME=\"ESP8266_custom\"
    -D DATA_PINS=2                  ; GPIO für die LED-Datenleitung
    ${wled_custom.build_flags}

; ----------------------------------------------------------------------------
; Wemos/LOLIN D1 mini – LED-Daten an GPIO2 (D4)
; ----------------------------------------------------------------------------
[env:wled_d1mini]
extends     = env:nodemcuv2
board       = d1_mini
build_flags = ${common.build_flags} ${esp8266.build_flags}
    -D WLED_RELEASE_NAME=\"D1mini_custom\"
    -D DATA_PINS=2                  ; GPIO für die LED-Datenleitung
    ${wled_custom.build_flags}
