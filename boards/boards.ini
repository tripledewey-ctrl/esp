; =============================================================================
; Gemeinsame Board-Konfigurationen für alle Projekte in projects/
;
; Einbinden in einer platformio.ini eines Projekts:
;
;   [platformio]
;   extra_configs = ../../boards/boards.ini
;
;   [env:esp32dev]
;   extends = esp32_base
;
; Danach können pro Projekt Bibliotheken, Flags usw. ergänzt werden.
; =============================================================================

[common]
framework       = arduino
monitor_speed   = 115200
upload_speed    = 921600
monitor_filters = default, time, esp32_exception_decoder
build_flags     =
    -D MONITOR_SPEED=115200

; -----------------------------------------------------------------------------
; ESP32 (klassisch, z. B. ESP32-DevKitC, ESP32-WROOM-32, NodeMCU-32S)
; -----------------------------------------------------------------------------
[esp32_base]
platform        = espressif32@6.9.0
board           = esp32dev
framework       = ${common.framework}
monitor_speed   = ${common.monitor_speed}
upload_speed    = ${common.upload_speed}
monitor_filters = ${common.monitor_filters}
board_build.partitions = min_spiffs.csv   ; mehr Platz für App + OTA
build_flags     = ${common.build_flags} -D BOARD_ESP32
                  -D LED_BUILTIN_PIN=2

; -----------------------------------------------------------------------------
; ESP32-S3 (z. B. ESP32-S3-DevKitC-1, native USB)
; -----------------------------------------------------------------------------
[esp32s3_base]
extends         = esp32_base
board           = esp32-s3-devkitc-1
monitor_filters = default, time
build_flags     = ${common.build_flags} -D BOARD_ESP32S3
                  -D LED_BUILTIN_PIN=48          ; RGB-LED (WS2812) – je nach Board anpassen
                  -D ARDUINO_USB_CDC_ON_BOOT=1

; -----------------------------------------------------------------------------
; ESP32-C3 (z. B. ESP32-C3-DevKitM-1, Super Mini)
; -----------------------------------------------------------------------------
[esp32c3_base]
extends         = esp32_base
board           = esp32-c3-devkitm-1
monitor_filters = default, time
build_flags     = ${common.build_flags} -D BOARD_ESP32C3
                  -D LED_BUILTIN_PIN=8
                  -D ARDUINO_USB_MODE=1
                  -D ARDUINO_USB_CDC_ON_BOOT=1

; -----------------------------------------------------------------------------
; ESP8266 (z. B. NodeMCU v2/v3, Wemos/LOLIN D1 mini)
; -----------------------------------------------------------------------------
[esp8266_base]
platform        = espressif8266@4.2.1
board           = nodemcuv2
framework       = ${common.framework}
monitor_speed   = ${common.monitor_speed}
upload_speed    = 460800
monitor_filters = default, time, esp8266_exception_decoder
board_build.ldscript = eagle.flash.4m2m.ld   ; 4 MB Flash, 2 MB Dateisystem
build_flags     = ${common.build_flags} -D BOARD_ESP8266
                  -D LED_BUILTIN_PIN=2

[d1mini_base]
extends         = esp8266_base
board           = d1_mini

; -----------------------------------------------------------------------------
; Waveshare ESP32-S3-Matrix (ESP32-S3FH4R2: 4 MB Flash, 2 MB PSRAM, 8x8 WS2812)
; Doku: docs/boards/waveshare-esp32-s3-matrix.md
; -----------------------------------------------------------------------------
[waveshare_s3_matrix_base]
extends         = esp32_base
board           = lolin_s3_mini                ; gleicher Chip (S3FH4R2) wie die Matrix
board_build.flash_mode = dio
board_build.partitions = default.csv
monitor_filters = default, time
build_flags     = ${common.build_flags} -D BOARD_ESP32S3 -D BOARD_WAVESHARE_S3_MATRIX
                  -D BOARD_HAS_PSRAM
                  -D LED_BUILTIN_PIN=14          ; Datenleitung der 8x8-Matrix (kein einfache LED!)
                  -D MATRIX_PIN=14
                  -D MATRIX_WIDTH=8
                  -D MATRIX_HEIGHT=8
                  -D MATRIX_COLOR_ORDER=NEO_RGB  ; per Farbtest in matrix-demo prüfen
                  -D IMU_SDA_PIN=11
                  -D IMU_SCL_PIN=12
                  -D ARDUINO_USB_MODE=1
                  -D ARDUINO_USB_CDC_ON_BOOT=1
